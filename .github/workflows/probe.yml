# Runs tools/probe.py on GitHub's runners to inspect live feed formats. The
# development sandbox cannot reach ESPN, so this is how parsers get checked
# against real data. Triggered by changing the probe.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [claude/mlb-picks-review-jlx9w1]
    paths:
      - 'tools/probe.py'
      - '.github/workflows/probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/probe.py
