# Rebuild the betting board and publish it, on GitHub's runners rather than by
# waking an assistant session. The pipeline is pure standard-library Python, so
# there is nothing to install and nothing to pay for on a public repository.
#
# Two cadences, the same ones the assistant-driven routines used:
#   :20          full re-research -- refetch ratings, starters, prices; grade
#   :00 and :40  score refresh    -- regrade finished games only, no refetch
#
# ledger.json is the one file that cannot be rebuilt from the feeds, so it is
# committed back. board.html is a build artifact and goes straight to Pages.
name: board

on:
  schedule:
    - cron: '20 * * * *'
    - cron: '0,40 * * * *'
  workflow_dispatch:
  push:
    branches: [claude/mlb-picks-review-jlx9w1]
    paths:
      - '**.py'
      - 'board.html'
      - '.github/workflows/board.yml'

# One run at a time. The two schedules can otherwise overlap and race each
# other pushing ledger.json.
concurrency:
  group: board
  cancel-in-progress: false

permissions:
  contents: write        # commit ledger.json back
  pages: write           # publish the site
  id-token: write        # required by deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mlb-picks-review-jlx9w1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the board
        run: |
          if [ "${{ github.event.schedule }}" = "0,40 * * * *" ]; then
            python3 rebuild_board.py --scores
          else
            python3 rebuild_board.py
          fi

      - name: Commit the ledger
        run: |
          if git diff --quiet -- ledger.json; then
            echo "ledger unchanged"
            exit 0
          fi
          git config user.name  "board bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add ledger.json
          git commit -m "Grade the ledger [skip ci]"
          # another run may have landed while this one was fetching feeds
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin claude/mlb-picks-review-jlx9w1 \
              && git push origin HEAD:claude/mlb-picks-review-jlx9w1 && exit 0
            sleep $((i * 5))
          done
          echo "could not push the ledger after five tries" >&2
          exit 1

      - name: Assemble the site
        run: |
          mkdir -p site
          cp board.html site/index.html
          # the page polls this and reloads itself when it changes
          date -u +%Y-%m-%dT%H:%M:%SZ > site/build.txt
          cp ledger.json site/ledger.json
          touch site/.nojekyll

      # No configure-pages step: it only exists to hand a base URL to static
      # site generators, and this site is plain HTML. Its `enablement` option
      # cannot turn Pages on either -- the Actions token is refused ("Resource
      # not accessible by integration"), because creating a Pages site needs a
      # repository admin. That is a one-time switch in Settings -> Pages.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
