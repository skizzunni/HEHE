# Rebuild the betting board and publish it, on GitHub's runners rather than by
# waking an assistant session. The pipeline is pure standard-library Python, so
# there is nothing to install and nothing to pay for on a public repository.
#
# A full rebuild three times an hour. The assistant-driven routines used a
# `--scores` fast path in between, but that reads .cache/last_board.json from
# the previous run, and a runner is thrown away after every job -- so every
# score-only run died on "no prior board — run a full rebuild first". The fast
# path existed to save assistant time; here a full rebuild is 80 seconds and
# free, so there is nothing to save.
#
# ledger.json is the one file that cannot be rebuilt from the feeds, so it is
# committed back. board.html is a build artifact and goes straight to Pages.
name: board

# GitHub throttles scheduled workflows on public repos. Measured on this repo:
# gaps between consecutive scheduled runs of 267, 262, 205, 148 and 103 minutes
# against a 20-minute cron. repository_dispatch fires immediately every time --
# point a free cron service at
#   POST https://api.github.com/repos/skizzunni/HEHE/dispatches
#   Authorization: Bearer <fine-grained PAT, Contents: read+write>
#   body: {"event_type":"rebuild"}
on:
  repository_dispatch:
    types: [rebuild]
  schedule:
    - cron: '0,20,40 * * * *'
  workflow_dispatch:
  push:
    branches: [claude/mlb-picks-review-jlx9w1]
    paths:
      - '**.py'
      - 'board.html'
      - '.github/workflows/board.yml'

# One run at a time. The two schedules can otherwise overlap and race each
# other pushing ledger.json.
concurrency:
  group: board
  cancel-in-progress: false

permissions:
  actions: write         # each run starts the next one (see `next` below)
  contents: write        # commit ledger.json back
  pages: write           # publish the site
  id-token: write        # required by deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.clock.outputs.started }}
    steps:
      - id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: claude/mlb-picks-review-jlx9w1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Season results for ~40 leagues feed the ratings. A finished day never
      # changes, so keep them between runs instead of refetching every season.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: board-cache-${{ github.run_id }}
          restore-keys: board-cache-

      # Exclude old unpriced cached evidence before it can influence selection.
      - name: Normalize cached price evidence
        run: python3 tools/clv.py --limit 0

      - name: Rebuild the board
        run: python3 rebuild_board.py
        env:
          # optional: more books and Pinnacle's line (oddsapi.py); unset = off
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # what lost and why, every day, and the weights for the next picks
      - name: Review the day
        run: python3 tools/daily_review.py || echo "review failed -- board unaffected"

      # closing line value for every graded pick, and the hard rule: no
      # beating the close on Brier over 300 picks, no model (policy.py)
      # the nightly independent re-grade (game summaries, not the scoreboard
      # the grader reads); mismatches are listed on Results
      - name: Re-grade last nights
        run: python3 tools/regrade.py || echo "regrade failed -- board unaffected"

      - name: Closing line value
        run: python3 tools/clv.py --limit 150 || echo "clv failed -- board unaffected"

      # the forward shadow test of call tickets (calls.shadow_tickets)
      - name: Shadow tickets
        run: python3 tools/shadow.py || echo "shadow failed -- board unaffected"

      # every proposed change against the current chooser, on later games
      - name: Paired comparisons
        run: python3 tools/paired.py > /dev/null || echo "paired comparisons failed -- board unaffected"

      - name: Commit the ledger
        run: |
          git add ledger.json stacks.json
          git add -f review/ 2>/dev/null || true
          if [ -f props.json ]; then git add props.json; fi
          if [ -f locks.json ]; then git add locks.json; fi
          if [ -f frontier.json ]; then git add -f frontier.json; fi
          if [ -f calls.json ]; then git add -f calls.json; fi
          if [ -f value.json ]; then git add -f value.json; fi
          if [ -f safe_locks.json ]; then git add -f safe_locks.json; fi
          if [ -f lottery.json ]; then git add lottery.json; fi
          if [ -f data/td_history.json ]; then git add -f data/td_history.json; fi
          if [ -f data/ladder_history.json ]; then git add -f data/ladder_history.json; fi
          if [ -f data/paired_eval.json ]; then git add -f data/paired_eval.json; fi
          if git diff --cached --quiet; then
            echo "ledger unchanged"
            exit 0
          fi
          git config user.name  "board bot"
          git config user.email "board-bot@users.noreply.github.com"
          git commit -m "Grade the ledger [skip ci]"
          # another run may have landed while this one was fetching feeds
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin claude/mlb-picks-review-jlx9w1 \
              && git push origin HEAD:claude/mlb-picks-review-jlx9w1 && exit 0
            sleep $((i * 5))
          done
          echo "could not push the ledger after five tries" >&2
          exit 1

      - name: Assemble the site
        run: |
          mkdir -p site
          cp board.html site/index.html
          # the page polls this and reloads itself when it changes
          date -u +%Y-%m-%dT%H:%M:%SZ > site/build.txt
          cp ledger.json site/ledger.json
          # Today's Kalshi-ready tickets, for the bot on the Mac (bot/mac). It
          # cannot run here: Kalshi refuses sports trading from GitHub's
          # servers' locations (403 "not currently allowed in Washington").
          python3 -c "import json,datetime; b=json.load(open('.cache/last_board.json')); json.dump({'built': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'), 'kalshi_stacks': b.get('kalshi_stacks')}, open('site/kalshi_stacks.json','w'))" || echo "no stacks to publish"
          # The Mac posts its report to the one-commit bot-status branch.
          if git fetch -q --depth=1 origin bot-status 2>/dev/null; then
            git show FETCH_HEAD:bot_status.json > site/bot.json || rm -f site/bot.json
          fi
          touch site/.nojekyll

      # No configure-pages step: it only exists to hand a base URL to static
      # site generators, and this site is plain HTML. Its `enablement` option
      # cannot turn Pages on either -- the Actions token is refused ("Resource
      # not accessible by integration"), because creating a Pages site needs a
      # repository admin. That is a one-time switch in Settings -> Pages.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # A rebuild every five minutes. GitHub's cron is best-effort and on this repo
  # fires every 1.5 to 4 hours, so each run starts the next one instead: wait
  # out the rest of the five minutes, then dispatch. A run started by the
  # Actions token may trigger workflow_dispatch (the one exception to "token
  # events start no runs"). The concurrency group keeps at most one run going
  # and one waiting, so chains can never pile up; the cron above restarts the
  # chain if a dispatch is ever lost. Free on a public repository.
  next:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Start the next rebuild five minutes after this one began
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.build.outputs.started }}
        run: |
          now=$(date +%s)
          start=${STARTED:-$now}
          wait=$(( 300 - (now - start) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          # The chain is the board's heartbeat: the cron backstop is throttled
          # to gaps of 100-270 minutes, so one failed hand-off would leave the
          # site stale for hours. Retry with backoff before giving up.
          for i in 1 2 3 4 5 6; do
            if gh workflow run board.yml --repo "$GITHUB_REPOSITORY" \
                 --ref claude/mlb-picks-review-jlx9w1; then
              exit 0
            fi
            echo "hand-off attempt $i failed; retrying" >&2
            sleep $((i * 10))
          done
          echo "could not start the next rebuild after 6 tries" >&2
          exit 1
